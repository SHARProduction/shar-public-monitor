name: SHAR public monitor
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Check scope; fixtures use isolated TEST issues'
        type: choice
        default: fast
        options: [fast, full, fixture-failure, fixture-recovery]
permissions:
  contents: read
concurrency:
  group: shar-public-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm test
      - name: Run bounded public checks
        env:
          MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '43 3 * * *' && 'full' || 'fast') || inputs.mode || 'fast' }}
        run: node scripts/monitor.mjs "$MODE"
      - name: Preserve public report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-monitor-report
          path: report.json
          if-no-files-found: error
          retention-days: 30
  alert:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-monitor-report
      - name: Update incident and recovery state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/alert.mjs
